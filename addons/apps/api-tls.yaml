apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-tls
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: api-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - api.kyudo.com
    - api-v2.kyudo.com
  duration: 2160h    # 90 days
  renewBefore: 720h  # Renew 30 days before expiry